<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>群景薪資單</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap">
<style>
/* Layout: single phone column — month → this month's numbers (big steppers) → live payslip paper → settings; sticky bottom bar with net pay + export */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1A2433; --muted:#5B6676; --line:#D3DAE2;
  --accent:#2B4C8C; --accent-ink:#FFFFFF; --accent-soft:#E3EAF6; --seal:#B8352A; --warn:#9A5B00; --warn-soft:#FFF1D6;
  --input-bg:#F5F7FA; --paper:#FFFFFF; --paper-ink:#141414; --paper-line:#555;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-doc:"Noto Serif TC","DFKai-SB","BiauKai","標楷體","PMingLiU",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#18202A; --ink:#E6EBF1; --muted:#9AA6B5; --line:#2A3542;
  --accent:#8FB0EE; --accent-ink:#0D1420; --accent-soft:#1E2B42; --seal:#E27A64; --warn:#F2B455; --warn-soft:#3A2C14;
  --input-bg:#111820; --paper:#FBFBF9; --paper-ink:#141414; --paper-line:#555; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#18202A; --ink:#E6EBF1; --muted:#9AA6B5; --line:#2A3542;
  --accent:#8FB0EE; --accent-ink:#0D1420; --accent-soft:#1E2B42; --seal:#E27A64; --warn:#F2B455; --warn-soft:#3A2C14;
  --input-bg:#111820; --paper:#FBFBF9; --paper-ink:#141414; --paper-line:#555; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:2px}
header .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
header h1{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.month{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px}
.month input,.month select{font:inherit;font-weight:700;color:var(--ink);background:var(--input-bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.month input{width:84px;text-align:center}
.who{font-size:14px;color:var(--muted)}
.stepper{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding-block:4px}
.stepper + .stepper{border-top:1px dashed var(--line);padding-top:12px}
.stepper .lab{display:flex;flex-direction:column;min-width:0}
.stepper .lab b{font-weight:500;font-size:16px}
.stepper .lab small{color:var(--muted);font-size:12.5px}
.ctrl{display:flex;align-items:center;gap:6px}
.ctrl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--input-bg);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.ctrl button:active{background:var(--accent-soft)}
.ctrl input{width:64px;height:44px;text-align:center;font:inherit;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--surface);border:1.5px solid var(--accent);border-radius:12px}
.unit{font-size:13px;color:var(--muted);width:20px}
.field{display:grid;grid-template-columns:1fr 140px;align-items:center;gap:10px}
.field.full{grid-template-columns:1fr}
.field label{font-size:14.5px;min-width:0}
.field label small{display:block;color:var(--muted);font-size:12px}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--input-bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.field input[inputmode]{text-align:right;font-variant-numeric:tabular-nums}
.field textarea{min-height:96px;resize:vertical;line-height:1.6}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.card{gap:0}
details.card > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::after{content:"＋";color:var(--muted);font-weight:400}
details.card[open] > summary::after{content:"－"}
details.card[open] > summary{margin-bottom:12px}
.inner{display:flex;flex-direction:column;gap:12px}
.group-title{font-size:12.5px;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-top:6px}
.chip{display:inline-block;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.paper-shell{overflow-x:auto;border-radius:6px}
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--f-doc);padding:18px 14px;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(20,30,50,.08)}
.paper h3{margin:0 0 10px;text-align:center;font-size:19px;letter-spacing:.3em}
.paper table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.paper td{border:1px solid var(--paper-line);padding:4px 6px;vertical-align:middle}
.paper td.k{width:34%;text-align:center}
.paper td.v{text-align:center}
.paper tr.sec td{text-align:center;font-weight:700;background:#F1F1EE}
.paper tr.net td{font-weight:700;font-size:15px}
.paper td.note{vertical-align:top;text-align:left;font-size:12px;line-height:1.55;word-break:break-all}
.paper td.note b{font-weight:700;display:block}
.paper .ngrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:8px;padding-top:8px;border-top:1px dashed #999}
.paper .ncol{display:flex;flex-direction:column;gap:6px;min-width:0}
.paper .nright{border-left:1px dashed #999;padding-left:12px}
.paper .seal{color:#B8352A}
.close-btn{font:inherit;font-weight:700;padding:12px;border-radius:12px;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.close-btn.armed{background:var(--accent);color:var(--accent-ink);border-style:solid}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.bar-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.net-row{display:flex;justify-content:space-between;align-items:baseline}
.net-row span{font-size:13px;color:var(--muted)}
.net-row strong{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acts button{font:inherit;font-size:14px;font-weight:500;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--input-bg);color:var(--ink);cursor:pointer}
.acts button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.acts button:disabled{opacity:.45;cursor:default}
.toast{font-size:13px;color:var(--accent);min-height:1em;text-align:center}
#exportHost{position:fixed;left:-10000px;top:0;width:640px}
#exportHost .paper{box-shadow:none;border-radius:0;padding:28px 26px}
#exportHost .paper table{font-size:15px}
#exportHost .paper td.note{font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">群景國際商務法律事務所東台灣所</span>
    <h1>薪資單填寫</h1>
  </header>

  <section class="card">
    <h2>薪資月份</h2>
    <div class="month">
      <input id="year" type="text" inputmode="numeric" aria-label="民國年">年
      <select id="month" aria-label="月份"></select>
      <span class="who" id="who"></span>
    </div>
  </section>

  <section class="card" id="monthly">
    <h2>本月數字</h2>
    <div class="stepper" data-key="ot" data-step="0.5" data-max="46">
      <div class="lab"><b>加班時數</b><small>平日；前 2 小時 ×4/3，之後 ×5/3</small></div>
      <div class="ctrl"><button type="button" data-d="-1" aria-label="減少">−</button><input id="ot" inputmode="decimal"><button type="button" data-d="1" aria-label="增加">＋</button><span class="unit">時</span></div>
    </div>
    <div class="stepper" data-key="personal" data-step="1">
      <div class="lab"><b>事假時數</b><small>全額扣薪</small></div>
      <div class="ctrl"><button type="button" data-d="-1" aria-label="減少">−</button><input id="personal" inputmode="decimal"><button type="button" data-d="1" aria-label="增加">＋</button><span class="unit">時</span></div>
    </div>
    <div class="stepper" data-key="sick" data-step="1">
      <div class="lab"><b>病假時數</b><small>扣半薪</small></div>
      <div class="ctrl"><button type="button" data-d="-1" aria-label="減少">−</button><input id="sick" inputmode="decimal"><button type="button" data-d="1" aria-label="增加">＋</button><span class="unit">時</span></div>
    </div>
    <div class="stepper" data-key="annual" data-step="0.5">
      <div class="lab"><b>特休天數</b><small id="leaveLeft"></small></div>
      <div class="ctrl"><button type="button" data-d="-1" aria-label="減少">−</button><input id="annual" inputmode="decimal"><button type="button" data-d="1" aria-label="增加">＋</button><span class="unit">天</span></div>
    </div>
    <div id="otWarn" hidden><span class="chip">加班已超過每月 46 小時上限（勞基法§32）</span></div>
  </section>

  <details class="card">
    <summary>本月其他加減項</summary>
    <div class="inner">
      <div class="field"><label for="bonus">工作獎金</label><input id="bonus" inputmode="numeric"></div>
      <div class="field"><label for="otTaxable">應稅加班費</label><input id="otTaxable" inputmode="numeric"></div>
      <div class="field"><label for="festival">節日獎金</label><input id="festival" inputmode="numeric"></div>
      <div class="field"><label for="unusedLeave">未休假獎金</label><input id="unusedLeave" inputmode="numeric"></div>
      <div class="field"><label for="tax">薪資所得扣稅</label><input id="tax" inputmode="numeric"></div>
      <div class="field"><label for="otherDeduct">其他扣款</label><input id="otherDeduct" inputmode="numeric"></div>
    </div>
  </details>

  <section class="card">
    <h2>薪資單預覽</h2>
    <div class="paper-shell"><div class="paper" id="paper"></div></div>
  </section>

  <button type="button" class="close-btn" id="closeBtn">本月結算，開始下個月</button>
  <p class="hint">結算會清空本月數字並跳到下個月。特休以「設定」裡的特休紀錄為準，請假或預排時把日期加進去即可，不會重複計算。固定薪資與設定不變。資料只存在這支手機的瀏覽器裡。</p>

  <details class="card">
    <summary>設定（員工、固定薪資、特休）</summary>
    <div class="inner">
      <div class="group-title">員工資料</div>
      <div class="field"><label for="company">事業單位</label><input id="company" type="text"></div>
      <div class="field"><label for="name">員工姓名</label><input id="name" type="text"></div>
      <div class="field"><label for="jobTitle">職稱</label><input id="jobTitle" type="text"></div>
      <div class="field"><label for="hired">到職日</label><input id="hired" type="text"></div>
      <div class="field"><label for="pay">發給方式</label><select id="pay"><option>轉帳</option><option>現金</option></select></div>

      <div class="group-title">每月固定</div>
      <div class="field"><label for="basic">基本薪資</label><input id="basic" inputmode="numeric"></div>
      <div class="field"><label for="meal">伙食津貼</label><input id="meal" inputmode="numeric"></div>
      <div class="field"><label for="labor">勞保自負額</label><input id="labor" inputmode="numeric"></div>
      <div class="field"><label for="health">健保自負額</label><input id="health" inputmode="numeric"></div>
      <div class="field"><label for="pension">勞退自提</label><input id="pension" inputmode="numeric"></div>

      <div class="group-title">計薪基準（加班費、請假扣款）</div>
      <div class="field"><label for="baseMode">基準月薪</label><select id="baseMode"><option value="auto">基本薪資＋伙食津貼</option><option value="basic">只用基本薪資</option><option value="custom">自訂金額</option></select></div>
      <div class="field" id="customRow"><label for="baseCustom">自訂基準月薪</label><input id="baseCustom" inputmode="numeric"></div>
      <p class="hint" id="baseHint"></p>

      <div class="group-title">特休</div>
      <div class="field"><label for="leavePeriod">特休年度區間</label><input id="leavePeriod" type="text"></div>
      <div class="field"><label for="leaveTotal">本年度特休日數</label><input id="leaveTotal" inputmode="decimal"></div>
      <div class="field full"><label for="leaveRecords">歷次特休紀錄（含預排）<small>用「、」分隔，一個日期算 1 天；半天寫成「11/5半」</small></label><input id="leaveRecords" type="text"></div>

      <div class="group-title">備註</div>
      <div class="field full"><label for="history">調薪紀錄</label><textarea id="history"></textarea></div>
    </div>
  </details>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="net-row"><span id="barLabel">實領金額</span><strong id="netBar">0</strong></div>
    <div class="acts">
      <button type="button" class="primary" id="btnPng" disabled>存成圖片</button>
      <button type="button" id="btnXlsx" disabled>下載 Excel</button>
      <button type="button" id="btnCopy">複製文字</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </div>
</div>

<div id="exportHost" aria-hidden="true"><div class="paper" id="exportPaper"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const KEY='qunjing-payslip-v1';
const DEFAULTS={
  year:115, month:11,
  company:'群景國際商務法律事務所陳懿璿律師', name:'', jobTitle:'', hired:'', pay:'轉帳',
  ot:0, personal:0, sick:0, annual:0,
  bonus:0, otTaxable:0, festival:0, unusedLeave:0, tax:0, otherDeduct:0,
  basic:0, meal:0, labor:0, health:0, pension:0,
  baseMode:'auto', baseCustom:0,
  leavePeriod:'', leaveTotal:0, leaveRecords:'',
  history:''
};
const NUM=['year','month','ot','personal','sick','annual','bonus','otTaxable','festival','unusedLeave','tax','otherDeduct','basic','meal','labor','health','pension','baseCustom','leaveTotal'];
let S=Object.assign({},DEFAULTS);
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null'); if(saved) S=Object.assign({},DEFAULTS,saved);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const trimN=n=>Number.isInteger(n)?String(n):String(+n.toFixed(2));

function countLeave(t){
  return String(t).split(/[、,，;；\s]+/).map(x=>x.trim()).filter(Boolean).reduce((n,x)=>n+(x.includes('半')?0.5:1),0);
}
function calc(){
  const base = S.baseMode==='basic'?S.basic : S.baseMode==='custom'?S.baseCustom : S.basic+S.meal;
  const hourly = Math.round(base/30/8*10000)/10000;
  const ot1=Math.min(S.ot,2), ot2=Math.max(S.ot-2,0);
  const otPay = Math.round(hourly*(ot1*4/3+ot2*5/3));
  const personalDed = Math.round(hourly*S.personal);
  const sickDed = Math.round(hourly*S.sick*0.5);
  const gross = S.basic+S.meal+S.bonus+otPay+S.otTaxable+S.festival+S.unusedLeave;
  const ded = personalDed+sickDed+S.labor+S.health+S.pension+S.tax+S.otherDeduct;
  const used = countLeave(S.leaveRecords);
  const left = S.leaveTotal-used;
  const otNote = `(${base}/240×4/3×${trimN(ot1)}${ot2>0?`＋${base}/240×5/3×${trimN(ot2)}`:''})＝${fmt(otPay)}元`;
  const sickNote = `(${base}/30/8)×${trimN(S.sick)}×1/2＝${fmt(sickDed)}元`;
  const personalNote = `(${base}/30/8)×${trimN(S.personal)}＝${fmt(personalDed)}元`;
  const leaveNote = `${S.leavePeriod}共有特休${trimN(S.leaveTotal)}日，本月請${trimN(S.annual)}天，已請（含預排）${trimN(used)}天，尚餘${trimN(left)}天，歷次特休紀錄：${S.leaveRecords}`;
  return {base,hourly,otPay,personalDed,sickDed,gross,ded,net:gross-ded,used,left,otNote,sickNote,personalNote,leaveNote};
}

function paperHTML(c){
  const r=(k,v)=>`<tr><td class="k">${k}</td><td class="v" colspan="2">${v}</td></tr>`;
  const sec=t=>`<tr class="sec"><td colspan="3">${t}</td></tr>`;
  return `<h3>薪資單</h3><table>
  ${sec('壹、員工基本資料')}
  ${r('薪資月份',`${S.year}年${S.month}月`)}${r('事業單位',esc(S.company))}${r('員工姓名',esc(S.name))}${r('職稱',esc(S.jobTitle))}${r('到職日',esc(S.hired))}
  ${r('加班時數',trimN(S.ot))}${r('事假時數',trimN(S.personal))}${r('病假時數',trimN(S.sick))}${r('特休天數',trimN(S.annual))}
  ${sec('貳、應發金額')}
  ${r('基本薪資',fmt(S.basic))}${r('伙食津貼',fmt(S.meal))}${r('工作獎金',fmt(S.bonus))}${r('免稅加班費（46hrs內）',fmt(c.otPay))}${r('應稅加班費',fmt(S.otTaxable))}${r('節日獎金',fmt(S.festival))}${r('未休假獎金',fmt(S.unusedLeave))}${r('應發金額小計',fmt(c.gross))}
  ${sec('參、應扣金額')}
  ${r('事假',fmt(c.personalDed))}${r('病假',fmt(c.sickDed))}${r('勞保自負額',fmt(S.labor))}${r('健保自負額',fmt(S.health))}${r('勞退自提',fmt(S.pension))}${r('薪資所得扣稅',fmt(S.tax))}${r('其他',fmt(S.otherDeduct))}${r('應扣金額小計',fmt(c.ded))}
  ${sec('肆、應領金額（應發金額減應扣金額）')}
  <tr class="net"><td class="k">實領金額</td><td class="v seal" colspan="2">${fmt(c.net)}</td></tr>
  <tr><td class="k">發給方式</td><td class="v">轉帳（ ${S.pay==='轉帳'?'O':'&nbsp;&nbsp;'} ）</td><td class="v">現金（ ${S.pay==='現金'?'O':'&nbsp;&nbsp;'} ）</td></tr>
  <tr class="sec"><td colspan="3">備註欄</td></tr>
  <tr><td class="note" colspan="3"><b>調薪紀錄：</b>${esc(S.history)}
    <div class="ngrid"><div class="ncol"><div><b>加班費計算：</b>${c.otNote}</div><div><b>事假計算：</b>${c.personalNote}</div><div><b>病假計算：</b>${c.sickNote}</div></div><div class="ncol nright"><div><b>特休紀錄：</b>${esc(c.leaveNote)}</div></div></div></td></tr>
  </table>`;
}

function render(fromInput){
  const c=calc();
  $('paper').innerHTML=paperHTML(c);
  $('netBar').textContent='NT$ '+fmt(c.net);
  $('barLabel').textContent=`${S.year}年${S.month}月 實領金額`;
  $('who').textContent=`${S.name}・${S.jobTitle}`;
  $('leaveLeft').textContent=`已請（含預排）${trimN(c.used)} 天，尚餘 ${trimN(c.left)} 天`;
  $('otWarn').hidden=!(S.ot>46);
  $('customRow').hidden=S.baseMode!=='custom';
  $('baseHint').textContent=`目前基準 ${fmt(c.base)} 元，時薪 ${c.hourly.toFixed(2)} 元（月薪÷30÷8）`;
  if(!fromInput) fillInputs();
  save();
}
function fillInputs(){
  for(const k of Object.keys(DEFAULTS)){const el=$(k==='month'?'month':k); if(el && document.activeElement!==el) el.value=S[k];}
}

// month select
for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'月';$('month').appendChild(o);}

// bind inputs
for(const k of Object.keys(DEFAULTS)){
  const el=$(k); if(!el) continue;
  el.addEventListener('input',()=>{S[k]=NUM.includes(k)?num(el.value):el.value; render(true);});
  el.addEventListener('change',()=>{S[k]=NUM.includes(k)?num(el.value):el.value; render(false);});
}
// steppers
document.querySelectorAll('.stepper').forEach(st=>{
  const k=st.dataset.key, step=parseFloat(st.dataset.step);
  st.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    S[k]=Math.max(0,Math.round((S[k]+step*parseFloat(b.dataset.d))*100)/100);
    $(k).value=S[k]; render(true);
  }));
});

// month close (two-tap confirm)
let armTimer=null;
$('closeBtn').addEventListener('click',()=>{
  const btn=$('closeBtn');
  if(!btn.classList.contains('armed')){
    btn.classList.add('armed'); btn.textContent=`確認結算 ${S.year}年${S.month}月？再按一次`;
    armTimer=setTimeout(()=>{btn.classList.remove('armed');btn.textContent='本月結算，開始下個月';},4000);
    return;
  }
  clearTimeout(armTimer);
  for(const k of ['ot','personal','sick','annual','bonus','otTaxable','festival','unusedLeave','tax','otherDeduct']) S[k]=0;
  if(S.month===12){S.month=1;S.year+=1;}else S.month+=1;
  btn.classList.remove('armed'); btn.textContent='本月結算，開始下個月';
  fillInputs(); render(false); toast(`已結算，現在是 ${S.year}年${S.month}月`);
});

let toastTimer=null;
function toast(t){$('toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',3500);}
const fileBase=()=>`薪資單_${S.name}_${S.year}年${S.month}月`;

// copy text
$('btnCopy').addEventListener('click',()=>{
  const c=calc();
  const t=[`【薪資單】${S.year}年${S.month}月 ${S.name}`,
  `應發 ${fmt(c.gross)}（基本${fmt(S.basic)}＋伙食${fmt(S.meal)}${c.otPay?`＋加班${fmt(c.otPay)}`:''}${S.bonus?`＋獎金${fmt(S.bonus)}`:''}${S.otTaxable?`＋應稅加班${fmt(S.otTaxable)}`:''}${S.festival?`＋節日${fmt(S.festival)}`:''}${S.unusedLeave?`＋未休假${fmt(S.unusedLeave)}`:''}）`,
  `應扣 ${fmt(c.ded)}（${[c.personalDed&&`事假${fmt(c.personalDed)}`,c.sickDed&&`病假${fmt(c.sickDed)}`,`勞保${fmt(S.labor)}`,`健保${fmt(S.health)}`,S.pension&&`勞退${fmt(S.pension)}`,S.tax&&`扣稅${fmt(S.tax)}`,S.otherDeduct&&`其他${fmt(S.otherDeduct)}`].filter(Boolean).join('、')}）`,
  `實領 ${fmt(c.net)} 元（${S.pay}）`,
  `加班費：${c.otNote}`,`事假：${c.personalNote}`,`病假：${c.sickNote}`,`特休：${c.leaveNote}`].join('\n');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已複製');}catch(e){toast('無法自動複製，請長按選取');}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('已複製，可貼到 LINE'),fallback);}else fallback();
});

// downloads
let downloads=null;
async function initDownloads(){
  try{downloads=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){downloads=null;}
  $('btnPng').disabled=false;$('btnXlsx').disabled=false;
}
async function saveFile(name,blob){
  if(downloads) return downloads.save({filename:name,data:blob});
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return {status:'shared'};}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return {status:'saved'};
}
function handleErr(e){
  if(e&&e.name==='AbortError') return toast('已取消');
  const code=e&&e.code;
  if(code==='declined') toast('已取消');
  else if(code==='rate_limited') toast('請稍候再試一次');
  else toast('這個畫面無法下載檔案');
}
$('btnPng').addEventListener('click',async()=>{
  if(!window.html2canvas) return toast('圖片元件尚未載入');
  $('btnPng').disabled=true; toast('產生圖片中…');
  try{
    $('exportPaper').innerHTML=paperHTML(calc());
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const canvas=await html2canvas($('exportPaper'),{scale:2,backgroundColor:'#FFFFFF'});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    await saveFile(fileBase()+'.png',blob); toast('完成');
  }catch(e){handleErr(e);}finally{$('btnPng').disabled=false;}
});
$('btnXlsx').addEventListener('click',async()=>{
  if(!window.ExcelJS) return toast('Excel 元件尚未載入');
  $('btnXlsx').disabled=true;
  try{
    const buf=await buildXlsx(calc());
    await saveFile(fileBase()+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})); toast('完成');
  }catch(e){handleErr(e);}finally{$('btnXlsx').disabled=false;}
});

async function buildXlsx(c){
  const wb=new ExcelJS.Workbook(); const ws=wb.addWorksheet('薪資單',{pageSetup:{paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:1}});
  ws.columns=[{width:24},{width:34},{width:34}];
  const font={name:'標楷體',size:12}; const th={style:'thin'};
  const rows=[
    ['sec','壹、員工基本資料'],['kv','薪資月份',`${S.year}年${S.month}月`],['kv','事業單位',S.company],['kv','員工姓名',S.name],['kv','職稱',S.jobTitle],['kv','到職日',S.hired],
    ['kv','加班時數',S.ot],['kv','事假時數',S.personal],['kv','病假時數',S.sick],['kv','特休天數',S.annual],
    ['sec','貳、應發金額'],['kv','基本薪資',S.basic],['kv','伙食津貼',S.meal],['kv','工作獎金',S.bonus],['kv','免稅加班費（46hrs內）',c.otPay],['kv','應稅加班費',S.otTaxable],['kv','節日獎金',S.festival],['kv','未休假獎金',S.unusedLeave],['kv','應發金額小計',c.gross],
    ['sec','參、應扣金額'],['kv','事假',c.personalDed],['kv','病假',c.sickDed],['kv','勞保自負額',S.labor],['kv','健保自負額',S.health],['kv','勞退自提',S.pension],['kv','薪資所得扣稅',S.tax],['kv','其他',S.otherDeduct],['kv','應扣金額小計',c.ded],
    ['sec','肆、應領金額（應發金額減應扣金額）'],['kv','實領金額',c.net]
  ];
  rows.forEach((row,i)=>{
    const r=i+1;
    if(row[0]==='sec'){ws.mergeCells(r,1,r,3);ws.getCell(r,1).value=row[1];}
    else{ws.getCell(r,1).value=row[1];ws.mergeCells(r,2,r,3);ws.getCell(r,2).value=row[2];if(typeof row[2]==='number')ws.getCell(r,2).numFmt='#,##0';}
  });
  ws.getCell('A31').value='發給方式';ws.getCell('B31').value=`轉帳（ ${S.pay==='轉帳'?'O':'   '} ）`;ws.getCell('C31').value=`現金（ ${S.pay==='現金'?'O':'   '} ）`;
  ws.mergeCells('A32:A37');ws.getCell('A32').value='備註欄';
  ws.mergeCells('B32:C32');ws.getCell('B32').value='調薪紀錄：';
  ws.mergeCells('B33:C33');ws.getCell('B33').value=S.history;
  ws.getCell('B35').value='加班費計算：\n'+c.otNote;
  ws.getCell('B36').value='事假計算：\n'+c.personalNote;
  ws.getCell('B37').value='病假計算：\n'+c.sickNote;
  ws.mergeCells('C35:C37');ws.getCell('C35').value='特休紀錄：\n'+c.leaveNote;
  for(let r=1;r<=37;r++){
    ws.getRow(r).height=19;
    for(let col=1;col<=3;col++){
      const cell=ws.getCell(r,col);
      cell.font=font; cell.border={top:th,left:th,bottom:th,right:th};
      cell.alignment= r>=32&&col>1 ? {vertical:'top',horizontal:'left',wrapText:true} : {vertical:'middle',horizontal:'center',wrapText:true};
    }
  }
  ws.getRow(33).height=52; ws.getRow(34).height=4; ws.getRow(35).height=36; ws.getRow(36).height=36; ws.getRow(37).height=36;
  return await wb.xlsx.writeBuffer();
}

fillInputs(); render(false); initDownloads();
</script>
</body></html>
